name: Build Custom Bazzite OS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Image Layer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Custom Image via Docker
        run: |
          docker build -t ghcr.io/o-dawg62/nucbox-g5-custom-bazzite:latest -f Containerfile .
          docker push ghcr.io/o-dawg62/nucbox-g5-custom-bazzite:latest
