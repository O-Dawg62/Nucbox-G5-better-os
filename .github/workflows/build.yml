      - name: Build Custom Bazzite Image and ISO
        uses: blue-build/github-action@v1
        with:
          recipe: 'recipe.yml'
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          
          # TURN ON THE STANDALONE INSTALLER GENERATOR HERE
          generate_iso: true
          iso_name: 'nucbox-g5-custom-os-latest.iso'
